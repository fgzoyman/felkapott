name: Idozitett Python Futtatas

on:
  schedule:
    - cron: '8 7,10,13,16,19,22 * * *'
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    # Megadjuk a munkamenetnek az írási jogot a kódon belül is
    permissions:
      contents: write

    steps:
    - name: Kod letoltese a repobol
      uses: actions/checkout@v4.2.2

    - name: Python kornyezet beallitasa
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.10'

    - name: Szukseges csomagok telepitese (opcionalis)
      run: |
        python -m pip install --upgrade pip
        # Ha a Python kódod használ külső könyvtárakat (pl. beautifulsoup4, jinja2), ide írd őket:
        pip install seleniumbase datetime

    - name: A Python script futtatasa
      run: python Trending_now.py

    - name: HTML fajlok visszakuldese a repoba
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Csak a .html kiterjesztésű fájlokat készítjük elő feltöltésre
        git add *.html
        
        # Ellenőrizzük, hogy változott-e valami. Ha igen, commitolunk.
        git diff-index --quiet HEAD || git commit -m "Automatikus HTML frissites [skip ci]"
        git push


